
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV}
      # Porta interna fixa — comunicação container-to-container sempre em 3000.
      # Para expor no host com outra porta, adicione: ports: ["PORTA_HOST:3000"]
      API_PORT: "3000"
    networks:
      - homelab_net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
