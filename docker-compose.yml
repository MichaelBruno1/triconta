
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV}
      API_PORT: ${API_PORT}
    networks:
      - homelab_net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT}
    depends_on:
      - api
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
